[project]
name = "container-stocket-proxy"
version = "0.1.0"
description = "Container socket proxy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["main", "container_socket_proxy.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicity_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
addopts = "--cov=container_stocket_proxy --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["container_stocket_proxy"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
